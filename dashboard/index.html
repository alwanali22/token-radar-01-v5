<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Token Radar — radar-5</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header><h1>Token Radar <span class="tag">radar-5</span></h1></header>
<p id="summary"></p>
<div id="stats"></div>
<section id="kpis" aria-label="Key figures"></section>
<div id="badges" aria-label="Self checks"></div>
<div id="controls">
<input id="q" type="search" placeholder="Search name or slug" aria-label="Search">
<select id="cat" aria-label="Category"><option value="">All categories</option></select>
<select id="chain" aria-label="Chain"><option value="">All chains</option></select>
<label><input id="watch" type="checkbox"> Watchlist only</label>
<select id="verdict" aria-label="Verdict">
<option value="">All verdicts</option><option>FARM</option><option>MARGINAL</option><option>THIN</option><option>SKIP</option>
</select>
<select id="sort" aria-label="Sort">
<option value="implied">Sort: implied value</option><option value="net">Sort: farm net</option>
<option value="tvl">Sort: TVL</option><option value="age">Sort: age</option>
</select>
</div>
<div id="tabs">
<button id="tab-board" class="on">Board</button>
<button id="tab-live">Live tokens (24)</button>
</div>
<div id="board-panel">
<table id="board-table">
<thead><tr><th>#</th><th>Protocol</th><th>TVL</th><th>Implied</th><th>Range</th><th>Odds</th><th>Verdict</th><th>Net</th><th>Net/h</th></tr></thead>
<tbody id="board-body"></tbody>
</table>
</div>
<div id="live-panel" hidden>
<table id="live-table">
<thead><tr><th>#</th><th>Protocol</th><th>Category</th><th>TVL</th><th>Market cap</th></tr></thead>
<tbody id="live-body"></tbody>
</table>
</div>
<section id="ledger"><h2>Ledger — all 758 protocols</h2><div id="ledger-body"></div></section>
<section id="farm-next"><h2>Farm next</h2><div id="farm-next-body"></div></section>
<section id="scatter"><h2>Live tokens: market cap vs TVL</h2><div id="scatter-body"></div></section>
<section id="research-note"><h2>How to read this board</h2><div id="research-note-body"></div></section>
<section id="model-panel"><h2>Model evidence</h2><div id="model-panel-body"></div></section>
<div id="dlg" hidden><div id="dlg-card">
<button id="dlg-close">Close</button>
<div id="dlg-body"></div>
</div></div>
<script src="../data.js"></script>
<script src="model.js"></script>
<script src="app.js"></script>
</body>
</html>
